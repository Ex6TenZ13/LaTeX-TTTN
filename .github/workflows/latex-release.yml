name: LaTeX PDF and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pdfLaTeX and preview tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            latexmk texlive-latex-extra texlive-fonts-recommended \
            texlive-science texlive-pictures tex-gyre poppler-utils
      - name: Build the report
        run: |
          mkdir -p .artifacts
          latexmk -norc -pdf -no-shell-escape -interaction=nonstopmode \
            -halt-on-error -file-line-error -outdir=.artifacts Bao_cao_TTTN.tex
          test -s .artifacts/Bao_cao_TTTN.pdf
          pdfinfo .artifacts/Bao_cao_TTTN.pdf
      - name: Render the first page
        run: |
          pdftoppm -f 1 -singlefile -scale-to 1400 -png \
            .artifacts/Bao_cao_TTTN.pdf .artifacts/Bao_cao_TTTN
      - name: Package and verify committed sources
        run: python3 .github/scripts/package-source.py
      - name: Save PDF, preview and ZIP build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-${{ github.sha }}
          path: |
            .artifacts/Bao_cao_TTTN.pdf
            .artifacts/Bao_cao_TTTN.png
            .artifacts/LaTeX-TTTN.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Save LaTeX diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: latex-diagnostics-${{ github.sha }}
          path: .artifacts/*.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  publish-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release tag on main history
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: report-${{ github.sha }}
          path: release-files
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          printf 'Source files packaged from commit %s.\n\nThis release has one asset: LaTeX-TTTN.zip. It contains Bao_cao_TTTN.tex, References.bib, Regulations.tex and figures/. The compiled PDF is available separately in the README preview.\n' \
            "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
            release-files/LaTeX-TTTN.zip
          gh release view "$TAG" --json assets --jq '[.assets[].name] | sort' \
            | jq -e '. == ["LaTeX-TTTN.zip"]'
          echo "Published $TAG with the source ZIP attached." >> "$GITHUB_STEP_SUMMARY"

  update-preview-from-tag:
    needs: [build, publish-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: latest-release-preview
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: report-${{ github.sha }}
          path: release-files
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: release-preview
          path: preview
          token: ${{ github.token }}
      - name: Update the PDF preview for this release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp release-files/Bao_cao_TTTN.pdf preview/Bao_cao_TTTN.pdf
          cp release-files/Bao_cao_TTTN.png preview/Bao_cao_TTTN.png
          jq -n --arg tag "$TAG" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            '{tagName: $tag, url: $url}' > preview/release.json
          git -C preview config user.name 'github-actions[bot]'
          git -C preview config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C preview add Bao_cao_TTTN.pdf Bao_cao_TTTN.png release.json
          if ! git -C preview diff --cached --quiet; then
            git -C preview commit -m "Update preview for $TAG"
            git -C preview push origin HEAD:release-preview
          fi
          echo "README preview now represents $TAG." >> "$GITHUB_STEP_SUMMARY"
